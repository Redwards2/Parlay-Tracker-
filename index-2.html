<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1512">
<meta name="mobile-web-app-capable" content="yes">
<title>Parlay Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column of bet tickets; each ticket stacks its legs as mini scoreboards, your team starred and lit. */
:root{
  --turf:#0f1512;        /* page */
  --board:#18201c;       /* ticket surface */
  --row:#1f2924;         /* game row */
  --line:#2c3832;        /* hairlines */
  --chalk:#eef3ef;       /* primary text */
  --dim:#93a39a;         /* secondary text */
  --lamp:#ffc94a;        /* stadium-light accent: your pick */
  --lamp-wash:rgba(255,201,74,.10);
  --win:#4ade80; --win-wash:rgba(74,222,128,.13);
  --loss:#f87171; --loss-wash:rgba(248,113,113,.13);
  --push:#a5b4fc;
  --display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --turf:#eef1ec; --board:#ffffff; --row:#f4f6f2; --line:#dbe1da; --chalk:#14201a; --dim:#5d6c63;
    --lamp:#b07800; --lamp-wash:rgba(232,165,20,.14);
    --win:#15803d; --win-wash:rgba(21,128,61,.10); --loss:#b91c1c; --loss-wash:rgba(185,28,28,.09); --push:#4f46e5;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --turf:#eef1ec; --board:#ffffff; --row:#f4f6f2; --line:#dbe1da; --chalk:#14201a; --dim:#5d6c63;
  --lamp:#b07800; --lamp-wash:rgba(232,165,20,.14);
  --win:#15803d; --win-wash:rgba(21,128,61,.10); --loss:#b91c1c; --loss-wash:rgba(185,28,28,.09); --push:#4f46e5;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--turf);color:var(--chalk);font:15px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.wrap{min-width:0;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#list{display:flex;flex-direction:column;gap:14px;min-width:0;width:100%}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px}
.brand{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{color:var(--lamp)}
.sync{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;height:36px;min-width:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--chalk)}
.iconbtn:hover{border-color:var(--dim)}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin svg{animation:none}}

.drop{border:1.5px dashed var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;background:transparent;text-align:left;width:100%}
.drop:hover{border-color:var(--lamp)}
.drop .plus{flex:none;width:40px;height:40px;border-radius:10px;background:var(--lamp);color:#1b1400;display:grid;place-items:center;font-size:24px;font-weight:700}
.drop b{display:block;font-weight:600}
.drop small{color:var(--dim)}

.ticket{min-width:0;max-width:100%;background:var(--board);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.t-head{padding:14px 16px 10px;display:flex;flex-direction:column;gap:8px}
.t-row1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.t-title{flex:1;font-family:var(--display);font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:.03em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.odds{font-family:var(--mono);font-size:13px;padding:2px 8px;border-radius:6px;background:var(--lamp-wash);color:var(--lamp);flex:none}
.t-money{display:flex;gap:16px;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.t-money b{color:var(--chalk);font-weight:600}
.verdict{display:flex;align-items:center;gap:10px;font-size:13px}
.pips{display:flex;gap:4px}
.pip{width:22px;height:6px;border-radius:3px;background:var(--line)}
.pip.winning,.pip.won{background:var(--win)}
.pip.losing,.pip.lost{background:var(--loss)}
.pip.tied{background:var(--push)}
.vtext{font-weight:600}
.vtext.alive{color:var(--win)} .vtext.dead{color:var(--loss)} .vtext.cashed{color:var(--win)} .vtext.wait{color:var(--dim)}

.legs{display:flex;flex-direction:column;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.game{background:var(--row);padding:10px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.teams{display:flex;flex-direction:column;gap:2px;min-width:0}
.team{display:grid;grid-template-columns:18px 22px minmax(0,1fr) auto;align-items:center;gap:8px;padding:4px 6px;border-radius:8px;min-width:0}
.team.mine{background:var(--lamp-wash)}
.team .star{color:var(--lamp);font-size:14px;line-height:1;text-align:center}
.team img,.team .logo-ph{width:22px;height:22px;object-fit:contain}
.team .logo-ph{border-radius:50%;background:var(--line)}
.team .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.team.mine .nm{font-weight:600;color:var(--chalk)}
.team:not(.mine) .nm{color:var(--dim)}
.team .rk{font-size:11px;color:var(--dim);margin-right:4px;font-variant-numeric:tabular-nums}
.team .sc{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.team:not(.mine) .sc{color:var(--dim)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.clock{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.clock.live{color:var(--chalk);display:flex;align-items:center;gap:6px}
.clock.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--loss)}
.state{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.state.winning,.state.won{background:var(--win-wash);color:var(--win)}
.state.losing,.state.lost{background:var(--loss-wash);color:var(--loss)}
.state.tied{background:transparent;color:var(--push);border:1px solid var(--push)}
.state.open{background:transparent;color:var(--lamp);border:1px solid var(--lamp)}
.pip.open{background:var(--lamp);opacity:.55}
.state.pending,.state.unmatched{background:transparent;color:var(--dim);border:1px solid var(--line)}
.legnote{grid-column:1/-1;font-size:12px;color:var(--dim);padding-left:6px}
.legnote em{color:var(--lamp);font-style:normal;font-weight:600}

.t-foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.txtbtn{background:none;border:none;color:var(--dim);font-size:13px;padding:6px 10px;border-radius:8px}
.txtbtn:hover{color:var(--chalk);background:var(--row)}

.empty{color:var(--dim);text-align:center;padding:24px 8px;font-size:14px}
.err{font-size:13px;color:var(--loss);background:var(--loss-wash);border-radius:10px;padding:10px 12px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--board);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:22px;letter-spacing:.03em}
.sheet .sub{margin:-8px 0 0;color:var(--dim);font-size:13px}
.preview{display:flex;gap:12px;align-items:center}
.preview img{width:84px;height:auto;border-radius:8px;border:1px solid var(--line)}
.progress{flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--dim)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lamp);transition:width .2s}
.grid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim);min-width:0}
label.f input,label.f select{background:var(--row);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0;color:var(--chalk)}
.legedit{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.legedit .lhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.legedit .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.legedit .row3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:11px 16px;font-weight:600}
.btn.primary{background:var(--lamp);color:#1b1400}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--chalk)}
.rawtext{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:pre-wrap;background:var(--row);border-radius:8px;padding:8px;max-height:120px;overflow:auto}
details summary{font-size:12px;color:var(--dim);cursor:pointer}
@media (max-width:420px){.grid2{grid-template-columns:1fr 1fr}.grid2 label:first-child{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Parlay<span>★</span>Board</div>
    <div class="sync">
      <span id="syncText">—</span>
      <button class="iconbtn" id="refreshBtn" aria-label="Refresh scores">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </header>

  <button class="drop" id="addBtn">
    <span class="plus">+</span>
    <span><b>Add a bet slip</b><small>Upload a screenshot from DraftKings. Your picks get starred.</small></span>
  </button>
  <input type="file" id="file" accept="image/*" hidden>

  <div id="err" class="err" hidden></div>
  <div id="list"></div>
</div>

<!-- edit / import sheet -->
<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Check your bet</h2>
    <p class="sub" id="sheetSub">Fix anything the scan got wrong, then save.</p>
    <div class="preview" id="ocrBox" hidden>
      <img id="ocrImg" alt="Bet slip screenshot">
      <div class="progress"><span id="ocrMsg">Reading slip…</span><div class="bar"><i id="ocrBar"></i></div></div>
    </div>
    <div class="grid2">
      <label class="f">Name<input id="fTitle" placeholder="Saturday parlay"></label>
      <label class="f">Odds<input id="fOdds" placeholder="+120" inputmode="text"></label>
      <label class="f">Wager $<input id="fWager" placeholder="10.00" inputmode="decimal"></label>
      <label class="f">To pay $<input id="fPay" placeholder="22.00" inputmode="decimal"></label>
      <label class="f">Game date<input id="fDate" type="date"></label>
    </div>
    <div id="legEdits" style="display:flex;flex-direction:column;gap:10px"></div>
    <button class="btn ghost" id="addLeg" type="button">+ Add leg</button>
    <details id="rawWrap" hidden><summary>Text read from the screenshot</summary><div class="rawtext" id="rawText"></div></details>
    <div class="actions">
      <button class="btn ghost" id="cancelBtn" type="button">Cancel</button>
      <button class="btn primary" id="saveBtn" type="button">Save bet</button>
    </div>
  </div>
</div>

<script>
/* ---------- storage ---------- */
const KEY = "parlayboard.bets.v1";
function load(){ try{ const v = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(v) ? v : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(bets)); }catch(e){} }
const uid = () => Math.random().toString(36).slice(2,10);

let bets = load();
if (!bets){
  // First open: Ryan's Week 9 Tailgate Special, preloaded
  bets = [{
    id: uid(), title: "Week 9 Tailgate Special", odds: "+120", wager: "10.00", toPay: "22.00", date: "2026-10-31",
    legs: [
      {id:uid(), pick:"Georgia", opp:"Florida", where:"vs", type:"ml", line:""},
      {id:uid(), pick:"Oklahoma State", opp:"Iowa State", where:"@", type:"ml", line:""},
      {id:uid(), pick:"Miami FL", opp:"North Carolina", where:"@", type:"ml", line:""}
    ]
  }];
  save();
}

/* ---------- slip parsing ---------- */
function parseSlip(text){
  const t = text.replace(/[\r\n]+/g," ").replace(/\s+/g," ")
                .replace(/\((OH|FL|Ohio|Florida)\)/gi, " $1");
  const legs = [];
  const re = /([A-Za-z0-9.&' -]+?)\s+to\s+Win\s*\(\s*(vs\.?|@|at)\s*([^()]+?)\s*\)/gi;
  let m;
  while ((m = re.exec(t))){
    const pick = m[1].trim().replace(/^(and|or)\s+/i,"");
    if (!pick) continue;
    legs.push({id:uid(), pick, opp:m[3].trim(), where:/^vs/i.test(m[2])?"vs":"@", type:"ml", line:""});
  }
  // Spread legs like "Georgia -7.5 (vs Florida)" or "Georgia +3 (@ Florida)"
  const sre = /([A-Za-z.&' ]{3,}?)\s+([+-]\d{1,2}(?:\.5)?)\s*\(\s*(vs\.?|@|at)\s*([^()]+?)\s*\)/gi;
  while ((m = sre.exec(t))){
    legs.push({id:uid(), pick:m[1].trim(), opp:m[4].trim(), where:/^vs/i.test(m[3])?"vs":"@", type:"spread", line:m[2]});
  }
  // Anytime TD scorer legs like "Cameron Dickey (TTU) ... Anytime TD Scorer"
  if (/anytime\s*(td|touchdown)/i.test(t)){
    const games = gameTeams(text);
    const pre = /([A-Z][A-Za-z.'-]+(?:\s+[A-Z][A-Za-z.'-]+){1,3})\s*\(([A-Z&]{2,5})\)/g;
    while ((m = pre.exec(t))){
      const player = m[1].trim(), abbr = m[2];
      const mine = games.filter(g => abbrFits(g, abbr));
      const pick = mine.length === 1 ? mine[0] : abbr;
      const opp = mine.length === 1 ? (games.find(g => g !== mine[0]) || "") : "";
      legs.push({id:uid(), player, pick, opp, where:"vs", type:"td", line:""});
    }
    // Multi-pick TD parlays: "Player / Anytime TD Scorer / MIN Today 1:00 PM DET" per leg
    if (!legs.some(l => l.type === "td")){
      const lines = String(text).split(/\n/).map(l => l.trim()).filter(Boolean);
      const n = (t.match(/anytime\s*(td|touchdown)/gi) || []).length;
      const NOT = /^(AM|PM|TD|OT|ET|EST|EDT|CT|CST|PT|PST|MT|Q[1-4])$/;
      const games = [];
      for (const line of lines){
        if (!/\d{1,2}:\d{2}|Final|Half|Today|Tomorrow/i.test(line) || /Wager|Pay/i.test(line)) continue;
        const codes = (line.match(/\b[A-Z]{2,4}\b/g) || []).filter(c => !NOT.test(c));
        if (codes.length >= 2) games.push([codes[0], codes[codes.length-1]]);
      }
      let players = [];
      const listLine = n > 1 && lines.find(l => (l.match(/,/g) || []).length >= n-1 && /^[A-Z][A-Za-z.'\- ,]+$/.test(l));
      if (listLine) players = listLine.split(",").map(x => x.trim()).filter(Boolean);
      if (players.length !== n){
        players = [];
        lines.forEach((l, i) => {
          if (!/anytime\s*(td|touchdown)/i.test(l)) return;
          const c = (lines[i-1] || "").match(/[A-Z][A-Za-z'\-]*\.?(?:\s*[A-Z]\.)?(?:\s+[A-Z][A-Za-z'\-]+)+/g);
          players.push(c ? c.sort((a, b) => b.length - a.length)[0] : "");
        });
      }
      for (let i = 0; i < n; i++){
        const g = games[i] || ["", ""];
        legs.push({id:uid(), player: players[i] || "", pick: g[0], opp: g[1], where:"@", type:"td", line:"", teamTBD:true});
      }
    }
  }
  const wager = (t.match(/Wager:?\s*\$?\s*([\d,]+\.\d{2})/i)||[])[1] || "";
  const toPay = (t.match(/To\s*Pay:?\s*\$?\s*([\d,]+\.\d{2})/i)||[])[1] || "";
  // Bet odds sit above "Wager"; leg odds below it don't count
  const oddsRe = /(?:^|\s)([+-]\d{3,4})(?=[\s,.]|$)/g;
  const oddsAll = t.split(/Wager/i)[0].match(oddsRe) || t.match(oddsRe) || [];
  const odds = oddsAll.length ? oddsAll[oddsAll.length-1].trim().replace(/[,.]$/,"") : "";
  let date = "";
  const dm = t.match(/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+(\d{1,2}),\s*(\d{4})/i);
  if (dm){
    const mi = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"].indexOf(dm[1].toLowerCase().slice(0,3));
    date = `${dm[3]}-${String(mi+1).padStart(2,"0")}-${dm[2].padStart(2,"0")}`;
  }
  const title = (t.match(/(Week\s+\d+\s+[A-Za-z ]+?Specials?)/i)||[])[1]
             || (t.match(/(\d+\s*(?:Pick|Leg)\s*Parlay)/i)||[])[1]
             || (legs.length > 1 ? `${legs.length}-Leg Parlay`
                 : legs.length === 1 && legs[0].type === "td" ? `${legs[0].player} Anytime TD` : "Straight bet");
  return {title: title.trim(), odds, wager:wager.replace(/,/g,""), toPay:toPay.replace(/,/g,""), date, legs};
}

// Team names from the live game box on a slip ("Arizona 3 14 6 - 23")
function gameTeams(raw){
  const skip = /^(Week|Wager|Pay|To|Odds|Boost|Live|Open|Yes|No)$/;
  const out = [];
  for (const line of String(raw).split(/\n/)){
    const m = line.match(/([A-Z][a-z][A-Za-z.&']*(?:\s+[A-Z][A-Za-z.&']*)*)\s+\d+\s+\S+/);
    if (m && !skip.test(m[1]) && !out.includes(m[1])) out.push(m[1]);
  }
  return out.slice(0, 2);
}
// Does a team abbreviation like TTU or FLA fit a name like "Texas Tech" or "Florida"?
function abbrFits(name, abbr){
  const words = name.toUpperCase().split(/\s+/), flat = words.join("");
  const initials = words.map(w => w[0]).join("");
  if (initials.length > 1 && abbr.startsWith(initials)) return true;
  if (flat[0] !== abbr[0]) return false;
  let i = 0; for (const ch of flat) if (ch === abbr[i]) i++;
  return i === abbr.length;
}

/* ---------- team matching ---------- */
const ALIAS = { "miami fl":"miami", "miami florida":"miami", "miami ohio":"miami oh", "ole miss":"ole miss",
  "usc":"usc", "lsu":"lsu", "ucf":"ucf", "uconn":"uconn", "pitt":"pittsburgh", "ok state":"oklahoma state",
  "okla state":"oklahoma state", "ohio st":"ohio state" };
function norm(s){
  let n = String(s||"").toLowerCase().replace(/&/g," and ").replace(/[().'’,-]/g," ").replace(/\s+/g," ").trim();
  n = n.replace(/\bst$/, "state").replace(/\bu$/, "");
  return ALIAS[n] || n;
}
function lev(a,b){
  if (Math.abs(a.length-b.length) > 2) return 9;
  const d = Array.from({length:a.length+1},(_,i)=>[i]);
  for (let j=1;j<=b.length;j++) d[0][j]=j;
  for (let i=1;i<=a.length;i++) for (let j=1;j<=b.length;j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
function teamScore(name, team){
  const q = norm(name); if (!q) return 0;
  const c = [team.location, team.shortDisplayName, team.displayName, team.abbreviation,
             `${team.abbreviation} ${team.name}`, `${team.location} ${team.name}`].filter(Boolean).map(norm);
  if (c.includes(q)) return 3;
  if (q.length >= 5 && c.some(x => x.length >= 5 && lev(q,x) <= 1)) return 2;   // OCR slips like "lowa"
  return 0;
}

/* ---------- scores (ESPN public scoreboard) ---------- */
const LEAGUES = [
  {key:"cfb",  path:"football/college-football", extra:["groups=80","groups=81"]},
  {key:"nfl",  path:"football/nfl", extra:[""]},
  {key:"nba",  path:"basketball/nba", extra:[""]},
  {key:"cbb",  path:"basketball/mens-college-basketball", extra:["groups=50"]},
  {key:"nhl",  path:"hockey/nhl", extra:[""]},
  {key:"mlb",  path:"baseball/mlb", extra:[""]},
];
const ymd = d => d.replace(/-/g,"");
function shiftDate(iso, days){ const d = new Date(iso+"T12:00:00"); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function todayISO(){ const d = new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }

const boardCache = new Map();
async function board(league, iso){
  const k = league.key+iso;
  if (boardCache.has(k)) return boardCache.get(k);
  const p = Promise.all(league.extra.map(async ex => {
    const url = `https://site.api.espn.com/apis/site/v2/sports/${league.path}/scoreboard?dates=${ymd(iso)}&limit=400${ex?"&"+ex:""}`;
    const r = await fetch(url, {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP "+r.status);
    return (await r.json()).events || [];
  })).then(arrs => {
    const seen = new Set(); const out = [];
    for (const e of arrs.flat()) if (!seen.has(e.id)){ seen.add(e.id); out.push(e); }
    return out;
  });
  boardCache.set(k, p);
  return p;
}
function findInEvents(leg, events){
  let best = null, bestS = 0;
  for (const ev of events){
    const comp = ev.competitions && ev.competitions[0]; if (!comp) continue;
    const [a,b] = comp.competitors;
    for (const [me,them] of [[a,b],[b,a]]){
      const sMe = teamScore(leg.pick, me.team);
      if (sMe < 2) continue;
      const sThem = leg.opp ? teamScore(leg.opp, them.team) : 0;
      if (leg.opp && sThem < 2) continue;
      if (!leg.opp && sMe < 3) continue;
      const s = sMe + sThem;
      if (s > bestS){ bestS = s; best = {ev, comp, me, them}; }
    }
  }
  return best;
}
async function locate(leg, iso){
  const order = leg.league ? [LEAGUES.find(l=>l.key===leg.league), ...LEAGUES.filter(l=>l.key!==leg.league)] : LEAGUES;
  for (const d of [iso, shiftDate(iso,1)]){
    for (const lg of order){
      try{
        const hit = findInEvents(leg, await board(lg, d));
        if (hit){ leg.league = lg.key; return hit; }
      }catch(e){ lastErr = e; }
    }
  }
  return null;
}

// Box score for one game, used to see who has scored touchdowns
const summaryCache = new Map();
function summary(leagueKey, eventId){
  const lg = LEAGUES.find(l => l.key === leagueKey), k = leagueKey + eventId;
  if (!summaryCache.has(k)) summaryCache.set(k,
    fetch(`https://site.api.espn.com/apis/site/v2/sports/${lg.path}/summary?event=${eventId}`, {cache:"no-store"})
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }));
  return summaryCache.get(k);
}
// Team rosters, used to tell which side a player is on when the slip only shows the matchup
const rosterCache = new Map();
function roster(leagueKey, teamId){
  const lg = LEAGUES.find(l => l.key === leagueKey), k = leagueKey + teamId;
  if (!rosterCache.has(k)) rosterCache.set(k,
    fetch(`https://site.api.espn.com/apis/site/v2/sports/${lg.path}/teams/${teamId}/roster`)
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }));
  return rosterCache.get(k);
}
function onRoster(r, player){
  const want = norm(player);
  return (r.athletes || []).flatMap(g => g.items ? g.items : [g])
    .some(a => norm(a.fullName || a.displayName) === want);
}

// Rushing, receiving and return TDs count; throwing one ("pass from X") doesn't
function playerTDs(sum, player){
  const parts = norm(player).split(" ").filter(w => !/^(jr|sr|ii|iii|iv|v)$/.test(w));
  if (!parts.length) return 0;
  const full = parts.join(" "), short = parts.length > 1 ? parts[0][0] + " " + parts[parts.length-1] : full;
  let n = 0;
  for (const p of sum.scoringPlays || []){
    const kind = ((p.scoringType && p.scoringType.name) || "") + " " + ((p.type && p.type.text) || "");
    if (!/touchdown/i.test(kind)) continue;
    const seg = " " + norm(String(p.text || "").split("(")[0].split(/\bpass from\b/i)[0]) + " ";
    if (seg.includes(" " + full + " ") || seg.includes(" " + short + " ")) n++;
  }
  return n;
}

/* ---------- leg / bet status ---------- */
function legStatus(leg, hit){
  if (!hit) return {state:"unmatched", label:"Not found"};
  const st = hit.comp.status || hit.ev.status;
  const phase = st.type.state;               // pre | in | post
  const my = Number(hit.me.score||0), op = Number(hit.them.score||0);
  if (phase === "pre") return {state:"pending", label:"Not started"};
  if (leg.type === "td"){
    if (hit.tds > 0) return {state:"won", label: hit.tds > 1 ? `${hit.tds} TDs` : "Scored"};
    if (hit.tds == null) return {state:"open", label:"Checking"};
    if (phase === "post" && st.type.completed !== false) return {state:"lost", label:"No TD"};
    return {state:"open", label:"No TD yet"};
  }
  let margin;
  if (leg.type === "spread") margin = my - op + Number(leg.line||0);
  else if (leg.type === "over") margin = (my + op) - Number(leg.line||0);
  else if (leg.type === "under") margin = Number(leg.line||0) - (my + op);
  else margin = my - op;
  const done = phase === "post" && st.type.completed !== false;
  if (done) return margin > 0 ? {state:"won",label:"Hit"} : margin < 0 ? {state:"lost",label:"Missed"} : {state:"tied",label:"Push"};
  const ml = leg.type === "ml";
  return margin > 0 ? {state:"winning",label: ml ? "Leading" : "Covering"}
       : margin < 0 ? {state:"losing", label: ml ? "Trailing" : "Short"}
       : {state:"tied", label:"Tied"};
}
function betVerdict(states, allTD){
  if (states.some(s=>s==="lost")) return {cls:"dead", text:"Busted"};
  if (states.length && states.every(s=>s==="won"||s==="tied")) return {cls:"cashed", text:"Cashed"};
  if (states.every(s=>s==="pending"||s==="unmatched")) return {cls:"wait", text:"Waiting on kickoff"};
  if (states.length === 1 && states[0] === "open") return {cls:"alive", text:"Alive · waiting on a TD"};
  const good = states.filter(s=>s==="won"||s==="winning").length;
  if (allTD) return {cls:"alive", text:`Alive · ${good}/${states.length} scored`};
  return {cls:"alive", text:`Alive · ${good}/${states.length} on track`};
}

/* ---------- render ---------- */
const $ = id => document.getElementById(id);
let lastErr = null, refreshing = false, timer = null, lastResults = new Map();
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STAR = "★";

function legNote(leg, hit){
  if (leg.type === "td"){
    const n = hit && hit.tds;
    return n > 0 ? `<em>★ ${esc(leg.player)}</em> scored${n > 1 ? ` ${n} TDs` : " a TD"}`
                 : `Need <em>★ ${esc(leg.player)}</em> to score a TD`;
  }
  if (leg.type === "spread") return `Need <em>${esc(leg.pick)} ${esc(leg.line)}</em>`;
  if (leg.type === "over")   return `Need <em>Over ${esc(leg.line)}</em> total points`;
  if (leg.type === "under")  return `Need <em>Under ${esc(leg.line)}</em> total points`;
  return "";
}
function teamRow(c, mine, pre){
  const t = c.team, rank = c.curatedRank && c.curatedRank.current && c.curatedRank.current <= 25 ? c.curatedRank.current : "";
  const logo = t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy">` : `<span class="logo-ph"></span>`;
  return `<div class="team${mine?" mine":""}"><span class="star">${mine?STAR:""}</span>${logo}
    <span class="nm">${rank?`<span class="rk">${rank}</span>`:""}${esc(t.shortDisplayName||t.displayName)}</span>
    <span class="sc">${pre ? "" : (c.score ?? "")}</span></div>`;
}
function render(){
  const list = $("list");
  if (!bets.length){ list.innerHTML = `<div class="empty">No bets yet. Add a slip screenshot to start tracking.</div>`; return; }
  list.innerHTML = bets.map(bet => {
    const states = [];
    const rows = bet.legs.map(leg => {
      const hit = lastResults.get(leg.id);
      const s = legStatus(leg, hit); states.push(s.state);
      if (!hit){
        return `<div class="game"><div class="teams">
          <div class="team${leg.teamTBD?"":" mine"}"><span class="star">${leg.teamTBD?"":STAR}</span><span class="logo-ph"></span><span class="nm">${esc(leg.pick)}</span><span class="sc"></span></div>
          <div class="team"><span class="star"></span><span class="logo-ph"></span><span class="nm">${leg.where==="@"?"@ ":"vs "}${esc(leg.opp||"?")}</span><span class="sc"></span></div>
        </div><div class="side"><span class="clock">${refreshing?"Looking…":"No game found"}</span><span class="state ${s.state}">${s.label}</span></div>
        ${legNote(leg, hit)?`<div class="legnote">${legNote(leg, hit)}</div>`:""}</div>`;
      }
      const st = hit.comp.status || hit.ev.status;
      const live = st.type.state === "in";
      const away = hit.comp.competitors.find(c=>c.homeAway==="away"), home = hit.comp.competitors.find(c=>c.homeAway==="home");
      return `<div class="game"><div class="teams">${teamRow(away, away===hit.me && !leg.teamTBD, st.type.state==="pre")}${teamRow(home, home===hit.me && !leg.teamTBD, st.type.state==="pre")}</div>
        <div class="side"><span class="clock${live?" live":""}">${esc(st.type.shortDetail||st.type.detail||"")}</span><span class="state ${s.state}">${s.label}</span></div>
        ${legNote(leg, hit)?`<div class="legnote">${legNote(leg, hit)}</div>`:""}</div>`;
    }).join("");
    const v = betVerdict(states, bet.legs.every(l => l.type === "td"));
    return `<article class="ticket" data-id="${bet.id}">
      <div class="t-head">
        <div class="t-row1"><span class="t-title">${esc(bet.title||"Parlay")}</span>${bet.odds?`<span class="odds">${esc(bet.odds)}</span>`:""}</div>
        <div class="t-money"><span>Wager <b>$${esc(bet.wager||"—")}</b></span><span>To pay <b>$${esc(bet.toPay||"—")}</b></span><span>${bet.legs.length} leg${bet.legs.length===1?"":"s"}</span></div>
        <div class="verdict"><span class="pips">${states.map(s=>`<i class="pip ${s}"></i>`).join("")}</span><span class="vtext ${v.cls}">${v.text}</span></div>
      </div>
      <div class="legs">${rows}</div>
      <div class="t-foot"><button class="txtbtn" data-act="edit">Edit</button><button class="txtbtn" data-act="del">Remove</button></div>
    </article>`;
  }).join("");
}

async function refresh(){
  if (refreshing) return;
  refreshing = true; lastErr = null; boardCache.clear(); summaryCache.clear(); rosterCache.clear();
  $("refreshBtn").classList.add("spin"); render();
  for (const bet of bets){
    const iso = bet.date || todayISO();
    await Promise.all(bet.legs.map(async leg => {
      const hit = await locate(leg, iso);
      if (hit && leg.type === "td" && leg.teamTBD && leg.player){
        try{
          const [r1, r2] = await Promise.all([roster(leg.league, hit.me.team.id), roster(leg.league, hit.them.team.id)]);
          const inMe = onRoster(r1, leg.player), inThem = onRoster(r2, leg.player);
          if (inMe !== inThem){
            if (inThem) [hit.me, hit.them] = [hit.them, hit.me];
            leg.pick = hit.me.team.abbreviation; leg.opp = hit.them.team.abbreviation; delete leg.teamTBD;
          }
        }catch(e){}
      }
      if (hit && leg.type === "td" && (hit.comp.status || hit.ev.status || {type:{}}).type.state !== "pre"){
        try { hit.tds = playerTDs(await summary(leg.league, hit.ev.id), leg.player || ""); } catch(e){ hit.tds = null; }
      }
      lastResults.set(leg.id, hit);
    }));
  }
  refreshing = false; save();
  $("refreshBtn").classList.remove("spin");
  const anyFound = [...lastResults.values()].some(Boolean);
  const errBox = $("err");
  if (lastErr && !anyFound){ errBox.textContent = "Couldn't reach the score feed. Check your connection, then tap refresh."; errBox.hidden = false; }
  else errBox.hidden = true;
  $("syncText").textContent = "Updated " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  render();
  schedule();
}
function schedule(){
  clearTimeout(timer);
  const live = [...lastResults.values()].some(h => h && (h.comp.status||h.ev.status).type.state === "in");
  timer = setTimeout(() => { if (!document.hidden) refresh(); else schedule(); }, live ? 30000 : 180000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

/* ---------- import + edit sheet ---------- */
let draft = null, editingId = null;
function legEditor(leg, i){
  return `<div class="legedit" data-leg="${leg.id}">
    <div class="lhead"><span>Leg ${i+1}</span><button class="txtbtn" data-rm="${leg.id}" type="button">Remove</button></div>
    <div class="row">
      <label class="f">Your team<input id="p_${leg.id}" value="${esc(leg.pick)}"></label>
      <label class="f">Opponent<input id="o_${leg.id}" value="${esc(leg.opp)}"></label>
    </div>
    <div class="row3">
      <label class="f">Bet type<select id="t_${leg.id}">
        ${[["ml","To win"],["spread","Spread"],["over","Over"],["under","Under"],["td","Anytime TD"]].map(([v,l])=>`<option value="${v}"${leg.type===v?" selected":""}>${l}</option>`).join("")}
      </select></label>
      <label class="f">Line<input id="l_${leg.id}" value="${esc(leg.line)}" placeholder="-7.5 or 48.5" inputmode="decimal"></label>
      <label class="f" style="grid-column:1/-1">Player (Anytime TD bets)<input id="pl_${leg.id}" value="${esc(leg.player||"")}" placeholder="Cameron Dickey"></label>
    </div></div>`;
}
function readEditors(){
  draft.legs = draft.legs.map(l => ({...l,
    pick: $("p_"+l.id).value.trim(), opp: $("o_"+l.id).value.trim(),
    type: $("t_"+l.id).value, line: $("l_"+l.id).value.trim(), player: $("pl_"+l.id).value.trim(), league: undefined }));
  draft.title = $("fTitle").value.trim(); draft.odds = $("fOdds").value.trim();
  draft.wager = $("fWager").value.trim(); draft.toPay = $("fPay").value.trim(); draft.date = $("fDate").value;
}
function paintSheet(){
  $("fTitle").value = draft.title||""; $("fOdds").value = draft.odds||""; $("fWager").value = draft.wager||"";
  $("fPay").value = draft.toPay||""; $("fDate").value = draft.date||todayISO();
  $("legEdits").innerHTML = draft.legs.map(legEditor).join("") ||
    `<div class="empty" style="padding:8px">No legs yet. Add one below.</div>`;
}
function openSheet(bet, fromScan){
  draft = JSON.parse(JSON.stringify(bet)); editingId = fromScan ? null : bet.id;
  $("sheetTitle").textContent = fromScan ? "Check your bet" : "Edit bet";
  $("sheetSub").textContent = fromScan ? "Fix anything the scan got wrong, then save." : "Change a leg, line or amount, then save.";
  $("ocrBox").hidden = !fromScan; $("rawWrap").hidden = true;
  paintSheet(); $("scrim").hidden = false;
}
function closeSheet(){ $("scrim").hidden = true; draft = null; editingId = null; }

$("addLeg").onclick = () => { readEditors(); draft.legs.push({id:uid(), pick:"", opp:"", where:"vs", type:"ml", line:""}); paintSheet(); };
$("legEdits").addEventListener("click", e => {
  const id = e.target.getAttribute("data-rm"); if (!id) return;
  readEditors(); draft.legs = draft.legs.filter(l => l.id !== id); paintSheet();
});
$("cancelBtn").onclick = closeSheet;
$("scrim").addEventListener("click", e => { if (e.target === $("scrim")) closeSheet(); });
$("saveBtn").onclick = () => {
  readEditors();
  draft.legs = draft.legs.filter(l => l.pick);
  if (!draft.legs.length) { $("sheetSub").textContent = "Add at least one leg with a team name."; return; }
  if (editingId) bets = bets.map(b => b.id === editingId ? {...draft, id: editingId} : b);
  else bets.unshift({...draft, id: uid()});
  save(); closeSheet(); refresh();
};

$("list").addEventListener("click", e => {
  const act = e.target.getAttribute("data-act"); if (!act) return;
  const id = e.target.closest(".ticket").dataset.id;
  if (act === "edit") openSheet(bets.find(b=>b.id===id), false);
  if (act === "del"){
    if (e.target.dataset.armed){ bets = bets.filter(b=>b.id!==id); save(); render(); }
    else { e.target.dataset.armed = "1"; e.target.textContent = "Tap again to remove"; setTimeout(()=>{ if(e.target.isConnected){ delete e.target.dataset.armed; e.target.textContent="Remove"; } }, 3000); }
  }
});

/* OCR via Tesseract.js, loaded on first use */
let tessReady = null;
function loadTesseract(){
  if (window.Tesseract) return Promise.resolve();
  if (!tessReady) tessReady = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload = res; s.onerror = () => rej(new Error("Couldn't load the text reader"));
    document.head.appendChild(s);
  });
  return tessReady;
}
// Dark-mode slips read better inverted to dark-on-light and scaled up
function prep(img){
  const scale = Math.min(2, 2400 / img.naturalWidth);
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth*scale); c.height = Math.round(img.naturalHeight*scale);
  const x = c.getContext("2d"); x.drawImage(img, 0, 0, c.width, c.height);
  const d = x.getImageData(0,0,c.width,c.height), p = d.data;
  let sum = 0;
  for (let i=0;i<p.length;i+=4){ const g = .299*p[i]+.587*p[i+1]+.114*p[i+2]; p[i]=p[i+1]=p[i+2]=g; sum+=g; }
  if (sum/(p.length/4) < 128) for (let i=0;i<p.length;i+=4){ p[i]=p[i+1]=p[i+2]=255-p[i]; }
  x.putImageData(d,0,0);
  return c;
}
$("addBtn").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  const url = URL.createObjectURL(f);
  openSheet({title:"", odds:"", wager:"", toPay:"", date:todayISO(), legs:[]}, true);
  $("ocrImg").src = url; $("ocrMsg").textContent = "Reading slip…"; $("ocrBar").style.width = "5%";
  try{
    await loadTesseract();
    const img = $("ocrImg"); if (!img.complete) await new Promise(r => img.onload = r);
    const { data } = await Tesseract.recognize(prep(img), "eng", {
      logger: m => { if (m.status === "recognizing text") $("ocrBar").style.width = Math.round(10 + m.progress*90) + "%"; }
    });
    const parsed = parseSlip(data.text);
    readEditors();
    draft = {...draft, ...parsed, legs: parsed.legs.length ? parsed.legs : draft.legs};
    paintSheet();
    $("rawText").textContent = data.text; $("rawWrap").hidden = false;
    $("ocrBar").style.width = "100%";
    $("ocrMsg").textContent = parsed.legs.length ? `Found ${parsed.legs.length} leg${parsed.legs.length===1?"":"s"}. Check them below.` : "Couldn't find legs automatically. Add them below.";
  }catch(err){
    $("ocrMsg").textContent = err.message + ". You can type the legs in below.";
  }
};

$("refreshBtn").onclick = refresh;
render();
refresh();
</script>
